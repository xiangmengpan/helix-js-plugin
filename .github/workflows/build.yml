name: Build
on:
  pull_request:
  push:
    branches:
      - master
  merge_group:
  schedule:
    - cron: "00 01 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  MSRV: "1.91"
  # This key can be changed to bust the cache of tree-sitter grammars.
  GRAMMAR_CACHE_VERSION: ""

jobs:
  check:
    name: Check (msrv)
    runs-on: ubuntu-latest
    if: github.repository == 'helix-editor/helix' || github.event_name != 'schedule'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.MSRV }}
          cache-key: build

      - name: Run cargo check
        run: cargo check

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    if: github.repository == 'helix-editor/helix' || github.event_name != 'schedule'
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: 1
      HELIX_LOG_LEVEL: info
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.MSRV }}
          cache-key: build
          cache-grammars: 'true'
          grammar-cache-version: ${{ env.GRAMMAR_CACHE_VERSION }}

      - name: Run cargo test
        run: cargo test --workspace

      - name: Run cargo integration-test
        run: cargo integration-test

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm, windows-11-arm]

  lints:
    name: Lints
    runs-on: ubuntu-latest
    if: github.repository == 'helix-editor/helix' || github.event_name != 'schedule'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.MSRV }}
          components: rustfmt, clippy
          cache-key: build

      - name: Run cargo fmt
        run: cargo fmt --all --check

      # 库里还有一批只跑在 `--lib` 的用例(server_manager / commands / view 等):
      # 只跑集成测试会漏掉它们。2026-10-17 前 `cargo test -p helix-term --lib` 一直是红的
      # (D8:进程级扩展配方缓存 + SM_* 环境变量并发互踩),修好后纳入门禁。
      - name: Run library unit tests
        run: cargo test --workspace --lib

      - name: Run cargo clippy
        # 带 --features integration:集成测试目标(`#[cfg(feature = "integration")]`)也过一遍 lint。
        # 不带它时,`plugin_roots_for` 这类"只在某 cfg 分支被调用"的项会漏检(D6 实证)。
        run: cargo clippy --workspace --all-targets --features integration -- -D warnings

      # release 语义单独过一遍:上一条跑在 dev(`debug_assertions=on`),看不见
      # "只被 `#[cfg(debug_assertions)]` 的表引用、自身却没挂 cfg"的项。
      # 2026-10-17 实测:`term_native` 在 dev/test 下始终被用到(clippy 全绿),
      # 只有 `cargo build --profile opt`(出二进制)才报 dead_code —— 属于发布前才会发现的洞。
      # `cargo check`/`clippy` 不链接,所以这里用 release cfg 的成本只有一次 check(本地 ~50s)。
      - name: Run cargo clippy (release cfg)
        run: cargo clippy --release --workspace -- -D warnings

      # Windows 编译面,两道:
      #   ① `-msvc`(发布用的那个 target,快):守 fork 新增的平台敏感面(pty/poll/子进程/家目录)。
      #   ② `-gnu` **整仓**:守"Windows 专有编译错 + 只在 `cfg(windows)` 分支上的 lint"。
      # 由来(真实事故):`pty` 的 `#[cfg(unix)]` 被一次插入挤到了 `mod permissions;` 上
      #   (`9d7eee12d`,10-16) ⇒ Windows 从那天起编不过,而**两周无人察觉**;
      #   2026-10-30 手工跑一次才发现是 **236 个 error**。补上这道门后第一次跑整仓就抓到
      #   `helix-tui` 的 2 处 `io::Error::new(Other, …)`(只在 Windows 分支上)。
      # 整仓为什么能跑:两个技巧(见 `contrib/ci/fake-cc.sh` 头注释)——
      #   ① `HELIX_DISABLE_AUTO_GRAMMAR_BUILD=1` 跳过 tree-sitter 的几十个 C 文件;
      #   ② 假 CC/AR 让仍是 C 依赖的 build script(`zstd-sys`/`tree-house-bindings`)造空产物。
      # 为什么整仓用 `-gnu`:`-msvc` 下 cc-rs 拒绝通用假编译器(实测);`-gnu` 足以做类型检查,
      #   发布产物仍走 msvc(release job)。
      # 成本:clippy/check 不链接 ⇒ 不需要 Windows linker(第一次 ~45s,带缓存 ~10s)。
      - name: Check Windows compile surface (msvc · platform-sensitive crates)
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo clippy -p helix-js -p helix-stdx --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - name: Check Windows compile surface (gnu · whole workspace)
        env:
          HELIX_DISABLE_AUTO_GRAMMAR_BUILD: "1"
          CC_x86_64_pc_windows_gnu: ${{ github.workspace }}/contrib/ci/fake-cc.sh
          AR_x86_64_pc_windows_gnu: ${{ github.workspace }}/contrib/ci/fake-ar.sh
        run: |
          rustup target add x86_64-pc-windows-gnu
          chmod +x contrib/ci/fake-cc.sh contrib/ci/fake-ar.sh
          # `--features integration`:把**集成测试目标**也编进 Windows 检查。
          # 不加时那些文件整个被 cfg 掉 ⇒ 曾经的 8 个 Windows 编译错(测试里的
          # `std::os::unix::fs::PermissionsExt`、无条件 `termina::event` 导入)一直是隐形的。
          cargo clippy --workspace --all-targets --features integration --target x86_64-pc-windows-gnu -- -D warnings

      - name: Run cargo doc
        run: cargo doc --no-deps --workspace --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  docs:
    name: Grammar Lint
    runs-on: ubuntu-latest
    if: github.repository == 'helix-editor/helix' || github.event_name != 'schedule'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.MSRV }}
          cache-key: build
          cache-grammars: 'true'
          grammar-cache-version: ${{ env.GRAMMAR_CACHE_VERSION }}

      - name: Validate queries
        if: always()
        run: cargo xtask query-check

      - name: Validate indents
        if: always()
        run: cargo xtask indent-check

      - name: Validate highlights
        if: always()
        run: cargo xtask highlight-check

      - name: Validate themes
        if: always()
        run: cargo xtask theme-check

      # 强制门禁(三半都要绿):
      #   ① plugins/helix.d.ts ↔ Rust 侧注册的 JS API(helix-js/src/lib.rs · icons.rs · commands.rs)
      #      脚本 plugins/tools/check_api_surface.mjs;
      #   ② docs/plugin-api.md ↔ 同一份注册表(文档此前没有任何门禁 ⇒ 静默腐烂:实测 4 个已删 API
      #      还在文档里、17 个已注册 API 完全没记),脚本 plugins/tools/check_doc_surface.mjs;
      #   ③ **能力检查点 ↔ 注册的 JS API**(哪些 API 该受 process/fs_read/fs_write 检查)——
      #      实测三次靠人肉才发现漏网(`open_terminal`、`stat_async`/`glob_async`/`read_tree`/
      #      `watch`、`remove_plugin_file`),脚本 plugins/tools/check_capability_surface.mjs。
      # 两者都由 `cargo xtask api-check` 跑,用 ubuntu runner 预装的 node;漂移时退出码 1 ⇒ 这一步红。
      - name: Check plugin API surface
        if: always()
        run: cargo xtask api-check

      # 类型面门禁:api-check 只对账**名字与签名**(文本解析注册表),不查类型。
      # `helix.d.ts` 是插件作者唯一的补全/跳转来源 ⇒ 语法错、类型错、接口自相矛盾
      # 必须在这一步红。本机同命令:先 `npm i -g typescript@5.6.3`,再
      # `tsc --noEmit -p plugins/jsconfig.json`。
      - name: Check plugin type definitions
        if: always()
        run: |
          npm i -g typescript@5.6.3
          tsc --noEmit -p plugins/jsconfig.json

      - name: Generate docs
        if: always()
        run: cargo xtask docgen

      - name: Check uncommitted documentation changes
        if: always()
        run: |
          git diff
          git diff-files --quiet \
            || (echo "Run 'cargo xtask docgen', commit the changes and push again" \
            && exit 1)
