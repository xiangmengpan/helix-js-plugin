[package]
name = "helix-js"
version = "0.1.0"
edition = "2021"
description = "JavaScript plugin runtime for the Helix editor (PoC)"

[dependencies]
boa_engine = { workspace = true }
anyhow = "1"
libc = "0.2.186"
globset = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
helix-stdx = { path = "../helix-stdx" }
# 宽字符列宽:版本必须与 helix-tui/helix-core **同源**,否则 CJK 占列数会与渲染器打架
unicode-width = "=0.1.12"
unicode-segmentation = { workspace = true }
# 进程内模糊匹配(与核心 picker 同一套;helix.fuzzy.filter)
nucleo = { workspace = true }

# ConPTY（Windows 伪终端）要的 win32 绑定。**只**在 windows 目标上编译，
# 因此 Linux/macOS 的依赖树不受影响。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
