# ============================ 格式化 ============================

[server-manager.registry.ruff-format]
order = 50
kind = "formatter"
languages = ["python"]
bin-name = "ruff"
latest = "github:astral-sh/ruff"
cmd = "sh"
args = ["-c", "pip install --prefix {prefix} --disable-pip-version-check ruff && mkdir -p {prefix}/bin && ln -sf {prefix}/local/bin/ruff {prefix}/bin/ruff"]
format-args = ["format", "-"]
description = "Python formatter（ruff format，与 ruff linter 同一个二进制）"
homepage = "https://github.com/astral-sh/ruff"

[server-manager.registry.black]
order = 51
kind = "formatter"
languages = ["python"]
cmd = "sh"
args = ["-c", "pip install --prefix {prefix} --disable-pip-version-check black && mkdir -p {prefix}/bin && ln -sf {prefix}/local/bin/black {prefix}/bin/black"]
# 约定：helix 的 formatter 走 **stdin → stdout**；`-` 表示从标准输入读
format-args = ["-q", "-"]
description = "Python code formatter (black)"
homepage = "https://github.com/psf/black"

[server-manager.registry.prettier]
order = 52
kind = "formatter"
languages = ["javascript", "typescript", "html", "css", "json", "yaml", "markdown"]
cmd = "npm"
args = ["install", "--global", "--prefix", "{prefix}", "--no-fund", "--no-audit", "prettier"]
# `%{buffer_name}` 由编辑器展开成当前文件名（prettier 靠它猜语言）
format-args = ["--stdin-filepath", "%{buffer_name}"]
description = "Multi-language code formatter (prettier)"
homepage = "https://prettier.io"

