# server-manager 内置配方(数据与代码解耦;随 runtime 目录分发)。
#
# 加载与覆盖链(后者同名覆盖前者):
#   runtime/server-manager-builtin.toml(本文件,运行时可在 config_dir/runtime/ 放同名文件整体覆盖)
#   → config.toml [server-manager.registry.*] → server-manager-recipes.toml
#
# 字段(同 recipes 文件):
#   order          展示顺序(仅内置用;arsenal 行序)
#   kind           lsp|dap|linter|formatter(缺省 lsp)
#   languages      语言 id 列表
#   bin-name       可执行名(缺省 = 配方名)
#   url            release 下载模板({version}/{os}/{arch}/{triple} 占位);url = "" 表示占位条目(no source,按 description 引导)
#   version        固定版本;留空且 url 含 {version} 时须 needs-version = true(安装/升级弹版本输入)
#   needs-version  true = 允许 url 含 {version} 而 version 留空(动态版本配方)
#   strip          解压裁剪层数(默认 1;单文件 gzip 用 0)
#   bin            解压后链接到 managed/bin 的可执行相对路径(archive 类必填;url="" 时忽略)
#   cmd / args     包管理器类安装(cmd 与 url 二选一);cmd = "" 表示占位条目
#                   args 里可用 {prefix}(受管目录) / {version}
#   sha256         可选校验
#   latest         上游最新版来源(`github:owner/repo` 或返回纯文本版本号的 URL);`:server update check` 用
#   format-args    仅 formatter:写进 languages.toml 的 formatter.args(stdin → stdout 协议)
#   lint-cmd       仅 linter:shell 串(支持 %{file_path_absolute} 等变量);输出按 gcc 家族解析
#   description/homepage  展示数据
#
# 安装方式的选择原则:
#   - 生态有包管理器的(pip/npm/cargo/go)用 `cmd` 安装 —— 不需要逐平台 URL 与 sha256,长期更稳;
#   - 单二进制的 GitHub release(布局可预测的)用 archive + needs-version;
#   - 随系统/工具链分发的(clangd、rustfmt、gofmt、shfmt…)留**占位条目**:本机已有时会被自动挂接
#     (Local),没有时按 description 引导用系统包管理器装。

# ============================ LSP ============================

[server-manager.registry.rust-analyzer]
latest = "github:rust-lang/rust-analyzer"
order = 1
kind = "lsp"
languages = ["rust"]
bin-name = "rust-analyzer"
url = "https://github.com/rust-lang/rust-analyzer/releases/download/{version}/rust-analyzer-{triple}.gz"
strip = 0
bin = "rust-analyzer"
needs-version = true
description = "Rust language server"
homepage = "https://github.com/rust-lang/rust-analyzer"

[server-manager.registry.gopls]
order = 2
kind = "lsp"
languages = ["go"]
bin-name = "gopls"
cmd = "sh"
args = ["-c", "GOBIN={prefix}/bin go install golang.org/x/tools/gopls@latest"]
description = "Go official language server (go install)"
homepage = "https://github.com/golang/tools"

