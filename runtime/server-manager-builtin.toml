# ============================ Linter ============================
#
# `lint-cmd` 必须是 **gcc/parsable 家族**输出（`path:line:col: [severity:] msg`）——
# `:lint` 按这个格式解析。ruff(concise)/eslint(unix)/yamllint(parsable)/markdownlint-cli2
# 都是这一族。

[server-manager.registry.ruff]
order = 70
kind = "linter"
languages = ["python"]
bin-name = "ruff"
latest = "github:astral-sh/ruff"
cmd = "sh"
args = ["-c", "pip install --prefix {prefix} --disable-pip-version-check ruff && mkdir -p {prefix}/bin && ln -sf {prefix}/local/bin/ruff {prefix}/bin/ruff"]
lint-cmd = "ruff check --output-format=concise --no-fix %{file_path_absolute}"
description = "Python linter + formatter (ruff)"
homepage = "https://github.com/astral-sh/ruff"

[server-manager.registry.eslint]
order = 71
